name: checagem
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: checagem
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
      - name: grava o resultado
        run: |
          git config user.name "status-sentinela[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet || git commit -m "checagem $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
